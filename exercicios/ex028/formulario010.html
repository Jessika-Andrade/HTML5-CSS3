<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
       <!-- Normalmente, se utiliza div. Estamos utilizando parágrafo para evitar criar estilos -->
        <p>
            <label for="iano">Em que ano você nasceu? </label>
            <input type="number" name="ano" id="iano" min="1900" max="2030" oninput="calcIdade()">
        </p>
        
        <p>
           <label for="iidade">Sua idade é: </label>
           <output id="iidade">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <p><a href="index.html">Página 1</a></p>
    <p><a href="formulario002.html">Página 2</a></p>
    <p><a href="formulario003.html">Página 3</a></p>
    <p><a href="formulario004.html">Página 4</a></p>
    <p><a href="formulario005.html">Página 5</a></p>
    <p><a href="formulario006.html">Página 6</a></p>
    <p><a href="formulario007.html">Página 7</a></p>
    <p><a href="formulario009.html">Página 9</a></p>

    <script>
        function calcIdade() {
            let atual = new Date().getFullYear();
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
