    <title>Flexive Box</title>

        div.conteiner {
            background-color: pink;
            height: 300px;
            display: flex;

            align-items: stretch;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }

        ul {
            list-style-type: none;
            display: block;
            margin-top: 50px;
        }
    </style>
</head>

    <div class="conteiner">
        <div class="item">A</div>
